name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Runs alejandra, shellcheck, statix and deadnix, and evaluates the
      # NixOS configuration without building it.
      - run: nix flake check
