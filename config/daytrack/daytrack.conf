# daytrack settings (sourced by scripts/daytrack.sh). Times are in minutes.

# Daily productive-time goal; Waybar shows progress and you get one
# notification when you hit it.
GOAL_MIN=300

# Categories (from rules.tsv) that count as productive.
PRODUCTIVE="work ai learn write"

# Nudge to take a break after this much continuous productive time,
# then again every BREAK_REPEAT_MIN. 0 disables.
BREAK_AFTER_MIN=90
BREAK_REPEAT_MIN=30

# Nudge when one of these categories holds focus this long in a row,
# but only while today's goal is not yet met. 0 disables.
DISTRACT_CATS="fun"
DISTRACT_AFTER_MIN=20

# A focus streak survives interruptions (alt-tab to Spotify, a quick
# Discord reply) shorter than this.
STREAK_GRACE_MIN=3

# A streak at least this long counts as a deep-work session in reports.
DEEP_MIN=25

# Window titles in these categories are not written to disk.
PRIVATE_CATS="comms"

# Morning notification with yesterday's recap (1 = on).
RECAP=1
