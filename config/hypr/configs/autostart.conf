#############################
### AUTOSTART ###############
#############################

# Background daemons (hypridle, polkit agent, voxtype, night light, flameshot,
# KDE Connect) are systemd user services bound to graphical-session.target,
# which UWSM starts once Hyprland is up. Only the shell and GUI apps start here.

# Generate the matugen colours before the ArchEclipse shell starts, so its
# first frame already uses the wallpaper palette. It is also the notification
# daemon.
exec-once = $scripts/set-wallpaper.sh; $scripts/archeclipse.sh start
exec-once = [workspace 1 silent] brave
exec-once = [workspace 2 silent] code
exec-once = [workspace 2 silent] wezterm start --always-new-process
exec-once = [workspace 3 silent] spotify
exec-once = sleep 8; wezterm start --class scratchpad
