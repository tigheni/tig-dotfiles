#############################
### AUTOSTART ###############
#############################

exec-once = clipse -listen
# Make Wayland variables available to user systemd services started with the session.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE; systemctl --user restart voxtype.service

exec-once = wl-gammarelay-rs
exec-once = hypridle
exec-once = flameshot
exec-once = kdeconnectd
exec-once = kdeconnect-indicator
# Generate the matugen colours before the ArchEclipse shell starts, so its
# first frame already uses the wallpaper palette. It is also the notification
# daemon, so mako is not started.
exec-once = $scripts/set-wallpaper.sh; $scripts/archeclipse.sh start
exec-once = $scripts/night-light.sh
exec-once = [workspace 1 silent] sleep 4; brave
exec-once = [workspace 2 silent] sleep 4; code
exec-once = [workspace 2 silent] sleep 4; wezterm start --always-new-process
exec-once = [workspace 3 silent] sleep 4; spotify
exec-once = sleep 8; wezterm start --class scratchpad
exec-once = $scripts/daytrack.sh daemon
exec-once = qs
