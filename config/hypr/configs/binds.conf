
################################
### Applications ###
################################

bind = $mainMod, B, exec, brave
bind = $mainMod, F, exec, code
bind = $mainMod, T, exec, wezterm
bind = $mainMod, E, exec, nautilus
bind = $mainMod, S, exec, spotify
bind = $mainMod, O, exec, stremio
bind = $mainMod, N, exec, mullvad-gui
bind = $mainMod, U, exec, wezterm start --class float bluetuith
bind = $mainMod, V, exec, voxtype record start
bindr = $mainMod, V, exec, voxtype record stop
bind = $mainMod SHIFT, V, exec, wezterm start --class float clipse
bind = $mainMod, P, exec, hyprpicker -a
bind = $mainMod, R, exec, rofi -show drun
bind = CTRL_$mainMod, space, exec, playerctl --player=brave play-pause

################################
### Window Management ###
################################

#bind= $mainMod ,Up,exec,busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateTemperature n -500
#bind= $mainMod ,Down,exec,busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateTemperature n +500

bind = $mainMod, C, killactive
bind = $mainMod, SPACE, fullscreen, 0
bind = $mainMod SHIFT, SPACE, togglefloating
bind = ALT, Tab, fullscreenstate, 1 -1
bind = ALT, Tab, changegroupactive,

################################
### Workspaces ###
################################

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

################################
### Move Window To Workspace ###
################################

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind  = $mainMod SHIFT, E, togglegroup,
bind  = $mainMod CTRL, E, exec, hyprctl dispatch moveoutofgroup
bind  = $mainMod ALT, E, exec, hyprctl dispatch changegroupactive f
################################
### Workspace Navigation ###
################################

bind = $mainMod, H, workspace, e-1
bind = $mainMod, L, workspace, e+1

################################
### Scratchpad ###
################################

bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratchpad

################################
### Screenshots ###
################################

bind = , Print, exec, flameshot gui

################################
### Media ###
################################

bind =  $mainMod, X, exec,  playerctl -p spotify play-pause
binde = $mainMod, K, exec, playerctl previous
binde = $mainMod, J, exec, playerctl next
binde = $mainMod SHIFT, K, exec, playerctl position 5-
binde = $mainMod SHIFT, J, exec, playerctl position 5+

################################
### Volume ###
################################

binde = $mainMod, equal, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mainMod, backslash, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

################################
### Audio Output ###
################################

bind = $mainMod, Y, exec, /home/tig/tig-dotfiles/scripts/switch-audio-output-simple.sh

################################
### VPN ###
################################

bind = $mainMod, A, exec, mullvad status | grep -q Disconnected && mullvad connect || mullvad disconnect

################################
### Waybar ###
################################

bind = $mainMod, W, exec, pkill -SIGUSR1 waybar
#bind = $mainMod SHIFT, W, exec, pkill waybar

################################
### Notifications ###
################################

bind = $mainMod, Q, exec, makoctl dismiss

################################
### Lock / Power ###
################################

bind = $mainMod SHIFT, X, exec, hyprlock
bind = $mainMod SHIFT, S, exec, systemctl suspend
bind = CTRL_$mainMod, D, exec, systemctl poweroff

################################
### Reload ###
################################

bind = $mainMod SHIFT, R, exec, hyprctl reload

################################
### Mouse ###
################################

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
