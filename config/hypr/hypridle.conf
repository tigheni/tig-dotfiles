general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# Tell daytrack you went idle (backdated by the timeout) so AFK time
# isn't counted; locking also pauses it.
listener {
    timeout = 300
    on-timeout = $DOTFILES_DIR/scripts/daytrack.sh idle 300
    on-resume = $DOTFILES_DIR/scripts/daytrack.sh active
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1600
    on-timeout = systemctl suspend
}
