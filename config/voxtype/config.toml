# Voxtype is controlled by Hyprland's press/release bindings.
[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "tiny.en"

[output]
mode = "type"
fallback_to_clipboard = true

[output.notification]
on_recording_start = true
on_recording_stop = false
on_transcription = true
